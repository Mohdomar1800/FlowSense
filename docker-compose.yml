services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowsense-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: flowsense-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowsense}
      POSTGRES_USER: ${POSTGRES_USER:-flowsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowsense}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  redis:
    image: redis:7-alpine
    container_name: flowsense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
